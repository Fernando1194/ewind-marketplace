name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # tsc for both configs; any type error fails the run
      - name: Type check
        run: npm run typecheck
      # the build used in production (vite); the Supabase values are not needed to compile
      - name: Build
        run: npm run build
